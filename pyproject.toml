[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nai"
version = "1.1.0"
description = "Neuro-Atypicality Index — exploratory EEG normative atypicality framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NAI Project" }]
keywords = ["EEG", "ASD", "normative modeling", "connectivity", "Mahalanobis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "mne>=1.5",
  "mne-bids>=0.13",
  "tqdm>=4.65",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
graph = [
  "networkx>=3.0",
]

[project.urls]
Repository = "https://github.com/example/neuro-atypicality"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nai*"]

[tool.setuptools.package-data]
nai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]